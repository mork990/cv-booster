<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRONTLINE — Hybrid 3D</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#050709;color:white;font-family:Arial,sans-serif}main{height:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#182329,#050709 68%)}.w{width:min(480px,82vw)}b{font-size:72px;color:#eda049}.bar{height:3px;background:#ffffff20;margin:24px 0 10px;overflow:hidden}.bar i{display:block;height:100%;width:25%;background:#eda049;animation:a 1s linear infinite}@keyframes a{from{transform:translateX(-120%)}to{transform:translateX(500%)}}small{color:#aab3b6}</style></head><body><main><div class="w"><b>F</b><h1>FRONTLINE: MIDDLE EAST</h1><p>HYBRID 3D BUILD 1.1</p><div class="bar"><i></i></div><small id="s">טוען מנוע תלת־ממדי…</small></div></main><script>(async()=>{try{const f=["hybrid-01.dat","hybrid-02.dat","hybrid-03.dat","hybrid-04.dat"],a=[];for(let i=0;i<f.length;i++){s.textContent=`טוען מנוע תלת־ממדי ${Math.round(i/f.length*100)}%`;const r=await fetch(f[i],{cache:'no-store'});if(!r.ok)throw Error(f[i]+': HTTP '+r.status);a.push(await r.text())}const b=atob(a.join('').replace(/\s/g,'')),u=Uint8Array.from(b,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('נדרש Chrome או Edge מעודכן');const q=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip')),page=await new Response(q).text();document.open();document.write(page);document.close()}catch(e){console.error(e);s.textContent='טעינת המשחק נכשלה: '+e.message}})()</script></body></html>
