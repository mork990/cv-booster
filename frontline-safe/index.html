<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07090b"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>FRONTLINE — Safe Canvas Build 1.2</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#050709;color:#fff;font-family:Arial,sans-serif;overflow:hidden}main{height:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 42%,#1a252b,#050709 68%)}.wrap{width:min(540px,86vw)}.logo{font-size:94px;font-weight:950;color:#eda049;filter:drop-shadow(0 12px 28px #000)}h1{direction:ltr;margin:8px 0 4px;font-size:clamp(30px,7vw,56px);letter-spacing:-.06em}p{margin:0;color:#8e9a9e;font:800 10px Arial;letter-spacing:.18em;direction:ltr}.bar{height:3px;margin:28px auto 12px;background:#ffffff20;overflow:hidden}.bar i{display:block;width:24%;height:100%;background:#eda049;animation:l 1.05s ease-in-out infinite}small{display:block;color:#b1babd;line-height:1.6}.mode{margin-top:7px;color:#d69b61;font-size:11px;font-weight:800}@keyframes l{from{transform:translateX(-120%)}to{transform:translateX(520%)}}</style></head><body><main><div class="wrap"><div class="logo">F</div><h1>FRONTLINE: MIDDLE EAST</h1><p>SAFE CANVAS BUILD 1.2</p><div class="bar"><i></i></div><small id="s">מנקה את מטמון הגרסה הישנה…</small><div class="mode">NO WEBGL OR WEBGL2 REQUIRED</div></div></main><script>(async()=>{const s=document.getElementById('s');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const names=await caches.keys();await Promise.all(names.map(n=>caches.delete(n)))}const base='../frontline-middle-east/';const files=['v04-01.dat','v04-02a.dat','v04-02b.dat','v04-03.dat','v04-04.dat','v04-05.dat','v04-06.dat'],parts=[];for(let i=0;i<files.length;i++){s.textContent=`טוען מצב בטוח ${Math.round(i/files.length*100)}%`;const r=await fetch(base+files[i]+'?safe=1.2.1&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(files[i]+': HTTP '+r.status);parts.push(await r.text())}const b=atob(parts.join('').replace(/\s/g,'')),u=Uint8Array.from(b,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('נדרש Chrome או Edge מעודכן לצורך פתיחת קובץ המשחק');const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));let page=await new Response(stream).text();page=page.replace('</body>','<div style="position:fixed;left:14px;bottom:12px;z-index:9999;padding:7px 10px;border:1px solid #ffffff2a;border-radius:7px;background:#06090be8;color:#d5a16d;font:800 9px Arial;direction:ltr">SAFE CANVAS MODE · NO WEBGL2</div></body>');document.open();document.write(page);document.close()}catch(e){console.error(e);s.textContent='טעינת מצב התאימות נכשלה: '+e.message}})()</script></body></html>
