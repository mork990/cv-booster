<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07090b"><title>FRONTLINE: MIDDLE EAST</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#050709;color:#fff;font-family:Arial,sans-serif;overflow:hidden}main{height:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 42%,#1a252b,#050709 68%)}.wrap{width:min(520px,84vw)}.logo{font-size:92px;font-weight:950;color:#eda049;filter:drop-shadow(0 12px 26px #000)}h1{direction:ltr;margin:8px 0 4px;font-size:clamp(30px,7vw,54px);letter-spacing:-.06em}p{margin:0;color:#879398;font:700 10px Arial;letter-spacing:.18em;direction:ltr}.bar{height:3px;margin:28px auto 12px;background:#ffffff20;overflow:hidden}.bar i{display:block;width:24%;height:100%;background:#eda049;animation:l 1.05s ease-in-out infinite}small{display:block;color:#aab3b6;line-height:1.55}.mode{margin-top:7px;color:#d69b61;font-size:11px;font-weight:800}@keyframes l{from{transform:translateX(-120%)}to{transform:translateX(520%)}}</style></head><body><main><div class="wrap"><div class="logo">F</div><h1>FRONTLINE: MIDDLE EAST</h1><p>UNIVERSAL COMBAT BUILD 1.1</p><div class="bar"><i></i></div><small id="s">בודק תאימות גרפית…</small><div id="m" class="mode"></div></div></main><script>(async()=>{const s=document.getElementById('s'),m=document.getElementById('m'),q=new URLSearchParams(location.search),full=['webgl2-01.dat','webgl2-02.dat','webgl2-03.dat','webgl2-04.dat','webgl2-05.dat','webgl2-06.dat','webgl2-07.dat'],compat=['v04-01.dat','v04-02a.dat','v04-02b.dat','v04-03.dat','v04-04.dat','v04-05.dat','v04-06.dat'];function webgl2(){try{const c=document.createElement('canvas'),g=c.getContext('webgl2',{antialias:true,alpha:false,powerPreference:'high-performance'});if(!g)return false;g.getExtension('WEBGL_lose_context')?.loseContext();return true}catch{return false}}async function openBuild(files,label){m.textContent=label;const a=[];for(let i=0;i<files.length;i++){s.textContent=`טוען ${label} · ${Math.round(i/files.length*100)}%`;const r=await fetch(files[i],{cache:'no-store'});if(!r.ok)throw Error(files[i]+': HTTP '+r.status);a.push(await r.text())}s.textContent=`מפעיל ${label}…`;const b=atob(a.join('').replace(/\s/g,'')),u=Uint8Array.from(b,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('נדרש Chrome או Edge מעודכן');const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip')),page=await new Response(stream).text();document.open();document.write(page);document.close()}let mode=q.get('mode');if(mode!=='full'&&mode!=='compat')mode=webgl2()?'full':'compat';if(mode==='compat'){s.textContent='WebGL2 לא זמין — מצב תאימות הופעל אוטומטית';await new Promise(r=>setTimeout(r,450))}try{await openBuild(mode==='full'?full:compat,mode==='full'?'מצב תלת־ממד מלא':'מצב תאימות מהיר')}catch(e){console.error(e);if(mode==='full'){s.textContent='המנוע המלא לא עלה — עובר למצב תאימות…';await new Promise(r=>setTimeout(r,500));await openBuild(compat,'מצב תאימות מהיר')}else{s.textContent='טעינת המשחק נכשלה: '+e.message;m.textContent='נסה לרענן באמצעות Ctrl + Shift + R'}}})().catch(e=>{console.error(e);document.getElementById('s').textContent='טעינת המשחק נכשלה: '+e.message})</script></body></html>
