<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07090b"><title>FRONTLINE: MIDDLE EAST — WebGL2</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#050709;color:white;font-family:Arial,sans-serif;overflow:hidden}main{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#1a2329,#050709 67%)}.wrap{width:min(470px,82vw);text-align:center}.logo{font-size:85px;font-weight:950;color:#eda049;filter:drop-shadow(0 12px 25px #000)}h1{direction:ltr;margin:10px 0 4px;font-size:clamp(30px,7vw,52px);letter-spacing:-.06em}p{margin:0;color:#879398;font:700 9px Arial;letter-spacing:.18em;direction:ltr}.bar{height:2px;margin:28px auto 10px;background:#ffffff20;overflow:hidden}.bar i{display:block;width:22%;height:100%;background:#eda049;animation:l 1.1s ease-in-out infinite}small{color:#96a0a3}@keyframes l{from{transform:translateX(-120%)}to{transform:translateX(600%)}}</style></head><body><main><div class="wrap"><div class="logo">F</div><h1>FRONTLINE: MIDDLE EAST</h1><p>WEBGL2 BUILD 1.0</p><div class="bar"><i></i></div><small id="s">טוען מנוע תלת־ממדי…</small></div></main><script>(async()=>{try{const f=["webgl2-01.dat", "webgl2-02.dat", "webgl2-03.dat", "webgl2-04.dat", "webgl2-05.dat", "webgl2-06.dat", "webgl2-07.dat"];let a=[];for(let i=0;i<f.length;i++){s.textContent=`טוען מנוע תלת־ממדי ${Math.round(i/f.length*100)}%`;const r=await fetch(f[i],{cache:'no-store'});if(!r.ok)throw Error(f[i]+': HTTP '+r.status);a.push(await r.text())}const b=atob(a.join('').replace(/\s/g,'')),u=Uint8Array.from(b,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('יש לפתוח ב-Chrome או Edge מעודכנים');const q=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));const page=await new Response(q).text();document.open();document.write(page);document.close()}catch(e){console.error(e);s.textContent='טעינת המשחק נכשלה: '+e.message}})();</script></body></html>
